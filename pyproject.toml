[project]
name = "nicola-blog"
version = "0.1.0"
description = "Nicola's personal blog and documentation site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.4",
    "ad-docs @ file:///Users/nicolabrisotto/SRC/ADDICTIVE/ad-internal-docs-cli",
    "zensical>=0.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["main.py"]
