site_name: MkDocs Poetry Tutorial
docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    #- navigation.tabs
    #- navigation.sections
    
    - toc.follow #https://squidfunk.github.io/mkdocs-material/setup/setting-up-navigation/#anchor-following
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - tags


# gh-admonitions allow you to use the gh syntax for callouts:  `> [!TIP]`. `poetry add mkdocs-github-admonitions-plugin`. The ammonition markdown_extensions is required.


plugins:
  - search
  - macros
  - gh-admonitions
  - tags

# Exclude specific files from navigation warnings
exclude_docs: |
  elixir_examples/behaviours_defoverridable_example/README.md
  elixir_examples/behaviours_defoverridable_example/deps/cortex/README.md
  elixir_examples/behaviours_defoverridable_example/deps/cortex/LICENSE.md
  elixir_examples/behaviours_defoverridable_example/deps/file_system/README.md
  elixir_examples/dialyzer_playground/README.md
  elixir_examples/dialyzer_playground/deps/dialyxir/README.md

extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/YOUR_GITHUB_USERNAME
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/YOUR_TWITTER_USERNAME
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/YOUR_LINKEDIN_USERNAME

copyright: Copyright &copy; 2023 Your Name

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - meta
  - admonition

